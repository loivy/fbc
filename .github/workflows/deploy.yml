name: Deploy

# Requires repo secrets/vars to be configured once a GCP + Firebase project exists:
#   vars.GCP_PROJECT_ID, vars.GCP_REGION, vars.CLOUD_RUN_SERVICE
#   secrets.GCP_WORKLOAD_IDENTITY_PROVIDER, secrets.GCP_DEPLOY_SA  (Workload Identity Federation)
#   secrets.FIREBASE_TOKEN (or switch to WIF for Firebase Hosting too)
# Until those are set, this workflow is inert (present for when staging is provisioned).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Source deploy: Cloud Build compiles server/ with Google Cloud buildpacks
      # (via the gcp-build script in server/package.json). No Dockerfile involved.
      - name: Deploy to Cloud Run from source
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --source server \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet

  deploy-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build --workspace client
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.GCP_PROJECT_ID || 'fbc-founder-platform' }}
          channelId: live
